<!doctype html>
<!--
  The source of public/brand/mote-social-card.png, rendered to an exact
  1200 x 630 by scripts/render-og-card.ts.

  It is a page rather than a drawing because the card has to carry Geist, and
  the only Geist this project owns is the woff2 the site itself loads — a browser
  is the one thing on hand that can set type in it. The palette, the ambient Hue
  wash and the cropped capture are the same vocabulary as the site, so a link
  preview looks like the page it leads to.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Geist Variable";
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url("../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Geist Variable", sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        display: grid;
        width: 1200px;
        height: 630px;
        grid-template-columns: 1fr 1fr;
        overflow: hidden;
        background: #0b0c0b;
      }

      /* The site's ambient light: a few very large Hue colours whose centres sit
         off the card, so only the falloff reaches it. */
      .glow {
        position: absolute;
        inset: 0;
      }
      .glow i {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
      }
      .glow .amber {
        top: -280px;
        left: -160px;
        width: 760px;
        height: 700px;
        background: radial-gradient(circle, rgb(255 179 66 / 0.5), transparent 66%);
      }
      .glow .magenta {
        right: 120px;
        bottom: -340px;
        width: 720px;
        height: 660px;
        background: radial-gradient(circle, rgb(215 43 232 / 0.42), transparent 66%);
      }
      .glow .aqua {
        top: -220px;
        right: -200px;
        width: 640px;
        height: 620px;
        background: radial-gradient(circle, rgb(113 224 207 / 0.34), transparent 66%);
      }
      .glow .blue {
        bottom: -300px;
        left: -180px;
        width: 660px;
        height: 640px;
        background: radial-gradient(circle, rgb(69 126 255 / 0.36), transparent 66%);
      }

      .copy {
        position: relative;
        display: flex;
        padding: 72px 40px 72px 76px;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
        color: #f5f5f1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      .brand span {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      h1 {
        max-width: 12ch;
        font-size: 68px;
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 30ch;
        color: #b9bdb6;
        font-size: 23px;
        line-height: 1.5;
      }

      .badge {
        display: inline-flex;
        min-height: 46px;
        width: fit-content;
        padding-inline: 20px;
        align-items: center;
        border-radius: 999px;
        background: #ff4500;
        color: #10120f;
        font-size: 20px;
        font-weight: 600;
      }

      /* Anchored to the top of the stage so the window's lower half runs off the
         bottom of the card rather than being shrunk to fit — the same crop the
         site's own stages use. It stays inside the card horizontally: a window
         clipped down its right edge reads as a mistake, where one running off
         the bottom reads as a frame. */
      .stage {
        position: relative;
        overflow: hidden;
      }
      .stage img {
        position: absolute;
        top: 92px;
        left: 34px;
        width: 542px;
        border-radius: 16px 16px 0 0;
        box-shadow: 0 40px 80px rgb(0 0 0 / 0.55);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow">
        <i class="amber"></i>
        <i class="magenta"></i>
        <i class="aqua"></i>
        <i class="blue"></i>
      </div>

      <div class="copy">
        <div class="brand">
          <img src="../public/brand/mote-app-icon.png" alt="" />
          <span>Mote Desktop</span>
        </div>
        <h1>Philips Hue, on your PC.</h1>
        <p>Rooms, zones, scenes and desktop widgets, without reaching for your phone.</p>
        <div class="badge">Free on the Microsoft Store</div>
      </div>

      <div class="stage">
        <img src="../public/product/mote-dashboard-dark.png" alt="" />
      </div>
    </div>
  </body>
</html>
