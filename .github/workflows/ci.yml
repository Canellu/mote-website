name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check formatting, lint, and types
        run: vp check

      - name: Run tests
        run: vp test run

      - name: Build production site
        run: vp build

      # `bun run build` runs this after vp build; CI calls vp build directly, so
      # without this step nothing here would notice a route that stopped
      # prerendering, or a development-only asset reaching the client output.
      - name: Verify the static output
        run: node scripts/verify-static-output.mjs
